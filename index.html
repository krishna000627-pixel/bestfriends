<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payment To-Do</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7280;--ln:#e5e7eb;--ac:#2563eb;--ok:#16a34a;--chip:#eef2ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115;--card:#1a1d23;--tx:#e8eaed;--mu:#9aa0a8;--ln:#2a2e36;--ac:#60a5fa;--ok:#4ade80;--chip:#1e293b}}
:root[data-theme="dark"]{--bg:#0f1115;--card:#1a1d23;--tx:#e8eaed;--mu:#9aa0a8;--ln:#2a2e36;--ac:#60a5fa;--ok:#4ade80;--chip:#1e293b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 14px 8px;z-index:5;border-bottom:1px solid var(--ln)}
h1{font-size:18px;margin:0 0 6px}
.bar{height:6px;background:var(--ln);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:13px;margin:6px 0}
.tools{display:flex;gap:8px}
input[type=search]{flex:1;padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--tx);font-size:15px}
button{font:inherit;color:var(--tx)}
.tb{padding:8px 10px;border:1px solid var(--ln);border-radius:8px;background:var(--card)}
main{padding:10px 14px 40px;max-width:720px;margin:0 auto}
.it{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;gap:10px}
.it.done{opacity:.5}
.it.done .nm{text-decoration:line-through}
.it input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);flex:none}
.bd{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.nm{font-weight:600}
.sr{color:var(--mu);font-weight:400;margin-right:4px}
.amt{font-weight:600;color:var(--ac);white-space:nowrap;background:none;border:0;padding:0}
.bk{color:var(--mu);font-size:12px;margin:2px 0 6px}
.row{display:flex;align-items:center;gap:8px;margin-top:5px}
.lb{width:38px;color:var(--mu);font-size:12px;flex:none}
.cp{flex:1;text-align:left;background:var(--chip);border:0;border-radius:8px;padding:7px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;overflow-wrap:anywhere}
.cp.ok{outline:2px solid var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <h1>Payment To-Do</h1>
  <div class="bar"><i id="bar"></i></div>
  <div class="meta"><span id="cnt"></span><span id="tot"></span></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Search name, bank, IFSC, account">
    <button class="tb" id="hide">Hide done</button>
    <button class="tb" id="rst">Reset</button>
  </div>
</header>
<main id="list"></main>
<div id="toast"></div>
<script>
// [name, IFSC, account, bank, amount]
var D=[
["MOHAN RADHAKISHAN","UCBA0002092","20920110037737","UCO",15750],
["LAL SINGH MAN SINGH","UCBA0002092","20920110039441","UCO",19947],
["ARUN TARACHADRA","BKID0009545","954518210002972","BOI",10895],
["BRIJESH RAMDAS","PUNB0020800","0208001500022332","PNB",6371],
["CHINTARAM DEVLAL","PUNB0020800","6506001500024401","PNB",1998],
["DEEPAK BHAGWAT","NSPB0000002","501054293700","NSDL",1998],
["DEEPAK TRILOK","PUNB0020800","0208001700171218","PNB",20886],
["DEVEE SINGH KALA SINGH","UCBA0002092","20920110095577","UCO",20885],
["DEVKA BAI PUNAM","IDFB0041203","10010767879","IDFC BANK",6063],
["DHAN SINGH BONDAR","IPOS0000001","028210061747","POST OFFICE",6064],
["DINESH NANURAM","BARB0HARDAX","30730100010281","BOB",6371],
["GANESH JOKHILAL","PUNB0020800","0208000100133925","PNB",9994],
["GANGA RAMKISHAN","IDFB0041203","10010770564","IDFC",1998],
["GOURAV NOGAR SINGH","IBKL0001556","1556104000045225","IDBI BANK",6064],
["GOVIND TARACHANDRA","PUNB0020800","0208001700194820","PNB",6371],
["JITENDRA CHANDAN SINGH","PUNB0020800","0208001700174631","PNB",6063],
["KAILASH BAIRSINGH","CBIN0281358","3486275812","CBI",6063],
["KAJAL RAMKISHAN","PUNB0020800","0208001700193344","PNB",1998],
["KISHOR ROOP SING","UCBA0002092","20920110129579","UCO",20886],
["KRISHANA POONAM","PUNB0020800","0208001700102227","PNB",4196],
["LAXMAN NATTHU","CBIN0281358","1543054097","CBI",6062],
["MAHENDRA KUMAR","SBIN0000379","32537242614","SBI",4198],
["MANISHA BAI PYAR SINGH","PUNB0020800","0208001700046349","PNB",1998],
["MOHAN KAILASH","IPOS0000001","028210009321","BOI BANK",4197],
["PHULWATI TRILOK","UCBA0002092","20923211003830","UCO",6062],
["PUNAM BIKRAM","PUNB0020800","0208001700191638","PNB",6371],
["PYAR SINGH KAILASH","IPOS0000001","028210067423","POST",4198],
["RAJENDRA RAMDAS","IPOS0000001","028210063403","POST",1999],
["RIYAN SINGH","IDFB0041203","10011129643","IDFC BANK",6063],
["SANTILAL MANGILAL","BARB0DBHRDA","88080100019404","BOI",6371],
["SARSWATI BAI","PUNB0020800","0208001700070133","PNB",6371],
["SEEMA DHANSINGH","BARB0DBHRDA","88080100018082","BOB",6371],
["SEWARAM","SBIN0003734","10924837536","SBI",9993],
["SUBHASH DHANSING","UBIN0917800","520101068968112","UNION BANK",6063],
["SURESH DHANSINGH","IOBA0003781","378101000005045","IOB",4196],
["TULSIRAM ARJUN","UCBA0002092","20920110120347","UCO",20886],
["VIKRAM KANASE","UCBA0002092","20920110034910","UCO",6370],
["VILASH BER SINGH","BARB0DBHRD","88080100025675","CBI",20886],
["BASANT","BKID0009540","954010410001200","BOI",21000],
["SAURBHA HARDA","BARB0HARDA","30730200000257","BOB",35000]
];
var KEY="payment_todo_done_v1",done={},hideDone=false;
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){done={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var fmt=function(n){return n.toLocaleString("en-IN")};
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},1200)}
function copy(txt,btn,label){
  var ok=function(){btn.classList.add("ok");setTimeout(function(){btn.classList.remove("ok")},800);toast(label+" copied")};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,function(){fb()})}else fb();
  function fb(){var t=document.createElement("textarea");t.value=txt;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){toast("Copy failed")}document.body.removeChild(t)}
}
function render(){
  var q=$("q").value.trim().toLowerCase(),L=$("list");L.innerHTML="";
  D.map(function(r,i){return [r,i]}).reverse().forEach(function(p){
    var r=p[0],i=p[1],id=i+1,isDone=!!done[id];
    if(hideDone&&isDone)return;
    if(q&&(r.join(" ").toLowerCase().indexOf(q)<0))return;
    var d=document.createElement("div");d.className="it"+(isDone?" done":"");
    d.innerHTML='<input type="checkbox"'+(isDone?" checked":"")+'><div class="bd"><div class="top"><span class="nm"><span class="sr">'+id+'.</span>'+r[0]+'</span><button class="amt" data-c="'+r[4]+'" data-l="Amount">₹'+fmt(r[4])+'</button></div><div class="bk">'+r[3]+'</div><div class="row"><span class="lb">IFSC</span><button class="cp" data-c="'+r[1]+'" data-l="IFSC">'+r[1]+'</button></div><div class="row"><span class="lb">A/C</span><button class="cp" data-c="'+r[2]+'" data-l="Account no.">'+r[2]+'</button></div></div>';
    d.querySelector("input").onchange=function(e){if(e.target.checked)done[id]=1;else delete done[id];save();render()};
    d.querySelectorAll("button").forEach(function(b){b.onclick=function(){copy(b.dataset.c,b,b.dataset.l)}});
    L.appendChild(d);
  });
  var n=0,s=0,t=0;D.forEach(function(r,i){t+=r[4];if(done[i+1]){n++;s+=r[4]}});
  $("cnt").textContent=n+" / "+D.length+" done";
  $("tot").textContent="₹"+fmt(s)+" of ₹"+fmt(t);
  $("bar").style.width=(n/D.length*100)+"%";
}
$("q").oninput=render;
$("hide").onclick=function(){hideDone=!hideDone;this.textContent=hideDone?"Show done":"Hide done";render()};
$("rst").onclick=function(){if(confirm("Clear all ticks?")){done={};save();render()}};
render();
</script>
</body>
</html>
