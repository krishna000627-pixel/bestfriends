<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Payment To-Do</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#161a20;--mu:#667085;--ln:#e4e7ec;--ac:#2563eb;--ok:#059669;--no:#dc2626;--chip:#eef2ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1014;--card:#171a21;--tx:#e9ebef;--mu:#8b93a1;--ln:#262b35;--ac:#5b9cff;--ok:#34d399;--no:#f87171;--chip:#1d2330}}
:root[data-theme="dark"]{--bg:#0e1014;--card:#171a21;--tx:#e9ebef;--mu:#8b93a1;--ln:#262b35;--ac:#5b9cff;--ok:#34d399;--no:#f87171;--chip:#1d2330}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:11}
button{font:inherit;color:var(--tx);cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:8px 12px 4px;transition:transform .22s}
header.hide{transform:translateY(-115%)}
.hd{display:flex;align-items:center;gap:10px}
.ring{width:42px;height:42px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring circle{transition:stroke-dashoffset .3s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:11px}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:16px;margin:0}
.ttl small{color:var(--mu);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:42px;height:42px;border-radius:12px;border:1px solid var(--ln);background:var(--card);font-size:17px;padding:0 8px}
#sr{display:none;margin-top:6px}
#sr.on{display:block}
#q{width:100%;min-height:42px;padding:8px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font-size:16px}
.tabs{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:8px 0 6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:start;padding:7px 14px;border:1px solid var(--ln);border-radius:20px;background:var(--card);min-height:38px;font-size:14px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:6px 12px 110px;max-width:720px;margin:0 auto}
.hint{color:var(--mu);font-size:12px;text-align:center;margin:2px 0 8px}
.em{text-align:center;color:var(--mu);padding:40px 0}
.sw{position:relative;margin-bottom:9px;border-radius:14px;overflow:hidden}
.bg{position:absolute;inset:0;display:flex;align-items:center;padding-left:18px;color:#fff;font-weight:700;background:var(--ok)}
.sw.done .bg{background:var(--mu)}
.cd{position:relative;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px;touch-action:pan-y;transition:transform .17s;will-change:transform}
.cd.drag{transition:none}
.top{display:flex;align-items:center;gap:10px}
.ck{width:36px;height:36px;border-radius:50%;border:2px solid var(--ln);background:none;flex:none;font-size:18px;color:#fff;padding:0}
.done .ck{background:var(--ok);border-color:var(--ok)}
.nm{flex:1;min-width:0}
.nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--mu);font-size:12px}
.amt{font-weight:700;color:var(--ac);text-align:right;white-space:nowrap}
.amt s{display:block;color:var(--mu);font-weight:400;font-size:12px}
.done .top,.done .ch{opacity:.5}
.done .nm b{text-decoration:line-through}
.ch{display:grid;grid-template-columns:1fr 1.5fr;gap:6px;margin-top:8px}
.cp{min-height:46px;border:0;border-radius:10px;background:var(--chip);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;text-align:left;padding:4px 10px;overflow-wrap:anywhere;line-height:1.25}
.cp i{display:block;font-style:normal;font-family:system-ui,sans-serif;font-size:10px;color:var(--mu)}
.cp.ok{outline:2px solid var(--ok)}
.x{display:none;margin-top:8px;align-items:center;gap:8px}
.open .x{display:flex}
.lb{color:var(--mu);font-size:12px}
.ni{flex:1;min-width:0;min-height:42px;padding:7px 10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.tb{min-height:42px;padding:0 12px;border:1px solid var(--ln);border-radius:10px;background:var(--card)}
.df{font-weight:600}
.df.up{color:var(--no)}
.df.dn{color:var(--ok)}
.hl{animation:pl 1.1s}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 3px var(--ac)}}
.fab{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));height:52px;padding:0 20px;border:0;border-radius:26px;background:var(--ac);color:#fff;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:9}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:12}
#toast.on{opacity:1}
</style>
</head>
<body>
<header id="hd">
  <div class="hd">
    <div class="ring"><svg width="42" height="42" viewBox="0 0 42 42"><circle cx="21" cy="21" r="18" fill="none" stroke="var(--ln)" stroke-width="4"/><circle id="rg" cx="21" cy="21" r="18" fill="none" stroke="var(--ok)" stroke-width="4" stroke-linecap="round" stroke-dasharray="113.1" stroke-dashoffset="113.1"/></svg><b id="pc"></b></div>
    <div class="ttl"><h1>Payment To-Do</h1><small id="tot"></small></div>
    <button class="ib" id="sb" aria-label="Search">🔍</button>
    <button class="ib" id="rst" aria-label="Reset">↺</button>
  </div>
  <div id="sr"><input type="search" id="q" placeholder="Search name, bank, IFSC, account"></div>
  <div class="tabs"><button class="tab on" data-t="all"></button><button class="tab" data-t="todo"></button><button class="tab" data-t="done"></button><button class="tab" data-t="chg"></button></div>
</header>
<main>
  <div class="hint">Swipe a card right to mark paid · tap a name for new price</div>
  <div id="list"></div>
</main>
<button class="fab" id="nx">Next ▸</button>
<div id="toast"></div>
<script>
// [name, IFSC, account, bank, amount]
var D=[
["MOHAN RADHAKISHAN","UCBA0002092","20920110037737","UCO",15750],
["LAL SINGH MAN SINGH","UCBA0002092","20920110039441","UCO",19947],
["ARUN TARACHADRA","BKID0009545","954518210002972","BOI",10895],
["BRIJESH RAMDAS","PUNB0020800","0208001500022332","PNB",6371],
["CHINTARAM DEVLAL","PUNB0020800","6506001500024401","PNB",1998],
["DEEPAK BHAGWAT","NSPB0000002","501054293700","NSDL",1998],
["DEEPAK TRILOK","PUNB0020800","0208001700171218","PNB",20886],
["DEVEE SINGH KALA SINGH","UCBA0002092","20920110095577","UCO",20885],
["DEVKA BAI PUNAM","IDFB0041203","10010767879","IDFC BANK",6063],
["DHAN SINGH BONDAR","IPOS0000001","028210061747","POST OFFICE",6064],
["DINESH NANURAM","BARB0HARDAX","30730100010281","BOB",6371],
["GANESH JOKHILAL","PUNB0020800","0208000100133925","PNB",9994],
["GANGA RAMKISHAN","IDFB0041203","10010770564","IDFC",1998],
["GOURAV NOGAR SINGH","IBKL0001556","1556104000045225","IDBI BANK",6064],
["GOVIND TARACHANDRA","PUNB0020800","0208001700194820","PNB",6371],
["JITENDRA CHANDAN SINGH","PUNB0020800","0208001700174631","PNB",6063],
["KAILASH BAIRSINGH","CBIN0281358","3486275812","CBI",6063],
["KAJAL RAMKISHAN","PUNB0020800","0208001700193344","PNB",1998],
["KISHOR ROOP SING","UCBA0002092","20920110129579","UCO",20886],
["KRISHANA POONAM","PUNB0020800","0208001700102227","PNB",4196],
["LAXMAN NATTHU","CBIN0281358","1543054097","CBI",6062],
["MAHENDRA KUMAR","SBIN0000379","32537242614","SBI",4198],
["MANISHA BAI PYAR SINGH","PUNB0020800","0208001700046349","PNB",1998],
["MOHAN KAILASH","IPOS0000001","028210009321","BOI BANK",4197],
["PHULWATI TRILOK","UCBA0002092","20923211003830","UCO",6062],
["PUNAM BIKRAM","PUNB0020800","0208001700191638","PNB",6371],
["PYAR SINGH KAILASH","IPOS0000001","028210067423","POST",4198],
["RAJENDRA RAMDAS","IPOS0000001","028210063403","POST",1999],
["RIYAN SINGH","IDFB0041203","10011129643","IDFC BANK",6063],
["SANTILAL MANGILAL","BARB0DBHRDA","88080100019404","BOI",6371],
["SARSWATI BAI","PUNB0020800","0208001700070133","PNB",6371],
["SEEMA DHANSINGH","BARB0DBHRDA","88080100018082","BOB",6371],
["SEWARAM","SBIN0003734","10924837536","SBI",9993],
["SUBHASH DHANSING","UBIN0917800","520101068968112","UNION BANK",6063],
["SURESH DHANSINGH","IOBA0003781","378101000005045","IOB",4196],
["TULSIRAM ARJUN","UCBA0002092","20920110120347","UCO",20886],
["VIKRAM KANASE","UCBA0002092","20920110034910","UCO",6370],
["VILASH BER SINGH","BARB0DBHRD","88080100025675","CBI",20886],
["BASANT","BKID0009540","954010410001200","BOI",21000],
["SAURBHA HARDA","BARB0HARDA","30730200000257","BOB",35000]
];
var KEY="payment_todo_done_v1",NK="payment_todo_newprice_v1",tab="all",openId=0;
function ld(k){try{return JSON.parse(localStorage.getItem(k)||"{}")||{}}catch(e){return{}}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var done=ld(KEY),np=ld(NK);
var $=function(i){return document.getElementById(i)},L=$("list");
var fmt=function(n){return n.toLocaleString("en-IN")};
function vib(m){try{if(navigator.vibrate)navigator.vibrate(m)}catch(e){}}
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},1200)}
function copy(txt,btn,label){
  var ok=function(){vib(12);btn.classList.add("ok");setTimeout(function(){btn.classList.remove("ok")},800);toast(label+" copied")};
  function fb(){var t=document.createElement("textarea");t.value=txt;t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){toast("Copy failed")}document.body.removeChild(t)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fb)}else fb();
}
function has(id){return np[id]!=null&&np[id]!==""}
function render(){
  var q=$("q").value.trim().toLowerCase(),h="",n=0,s=0,t=0,ch=0,i;
  for(i=0;i<D.length;i++){var a=has(i+1)?Number(np[i+1]):D[i][4];if(has(i+1))ch++;t+=a;if(done[i+1]){n++;s+=a}}
  for(i=D.length-1;i>=0;i--){
    var r=D[i],id=i+1,d=!!done[id],hn=has(id),cur=hn?Number(np[id]):r[4];
    if((tab==="todo"&&d)||(tab==="done"&&!d)||(tab==="chg"&&!hn))continue;
    if(q&&r.join(" ").toLowerCase().indexOf(q)<0)continue;
    var df=!hn?"":cur===r[4]?' · <span class="df">same</span>':' · <span class="df '+(cur>r[4]?"up":"dn")+'">'+(cur>r[4]?"+":"\u2212")+"\u20b9"+fmt(Math.abs(cur-r[4]))+"</span>";
    h+='<div class="sw'+(d?" done":"")+(openId===id?" open":"")+'" data-id="'+id+'"><div class="bg">'+(d?"\u21ba Undo":"\u2713 Paid")+'</div><div class="cd"><div class="top"><button class="ck" aria-label="Done">'+(d?"\u2713":"")+'</button><div class="nm"><b>'+id+". "+r[0]+"</b><small>"+r[3]+df+'</small></div><div class="amt">'+(hn?"<s>\u20b9"+fmt(r[4])+"</s>":"")+"\u20b9"+fmt(cur)+'</div></div><div class="ch"><button class="cp" data-c="'+r[1]+'" data-l="IFSC"><i>IFSC</i>'+r[1]+'</button><button class="cp" data-c="'+r[2]+'" data-l="Account no."><i>A/C</i>'+r[2]+'</button></div><div class="x"><span class="lb">New \u20b9</span><input class="ni" type="number" inputmode="numeric" placeholder="new amount" value="'+(hn?np[id]:"")+'"><button class="tb cpa" data-c="'+cur+'" data-l="Amount">Copy \u20b9</button></div></div></div>';
  }
  L.innerHTML=h||'<p class="em">Nothing here</p>';
  var p=n/D.length;
  $("rg").style.strokeDashoffset=113.1*(1-p);
  $("pc").textContent=n+"/"+D.length;
  $("tot").textContent="\u20b9"+fmt(s)+" of \u20b9"+fmt(t);
  var tl={all:"All "+D.length,todo:"Pending "+(D.length-n),done:"Done "+n,chg:"New price "+ch};
  document.querySelectorAll(".tab").forEach(function(b){b.textContent=tl[b.dataset.t];b.classList.toggle("on",b.dataset.t===tab)});
}
function tog(id){
  var sw=L.querySelector('.sw[data-id="'+id+'"]');
  if(done[id])delete done[id];else done[id]=1;
  sv(KEY,done);vib(done[id]?25:10);
  var c=sw&&sw.querySelector(".cd");
  if(c&&tab!=="all"){c.style.transform="translateX(110%)";setTimeout(render,170)}else render();
}
var drag=null,moved=false;
L.addEventListener("pointerdown",function(e){var c=e.target.closest(".cd");if(!c||e.target.closest("input"))return;drag={c:c,x:e.clientX,y:e.clientY,dx:0,on:false}});
L.addEventListener("pointermove",function(e){
  if(!drag)return;
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.on){if(Math.abs(dx)>12&&Math.abs(dx)>Math.abs(dy)){drag.on=true;drag.c.classList.add("drag");try{drag.c.setPointerCapture(e.pointerId)}catch(x){}}else return}
  drag.dx=Math.max(0,Math.min(dx,170));
  drag.c.style.transform="translateX("+drag.dx+"px)";
});
function end(){
  if(!drag)return;var d=drag;drag=null;if(!d.on)return;
  moved=true;setTimeout(function(){moved=false},60);
  d.c.classList.remove("drag");
  if(d.dx>90)tog(+d.c.closest(".sw").dataset.id);else d.c.style.transform="";
}
L.addEventListener("pointerup",end);
L.addEventListener("pointercancel",end);
L.addEventListener("click",function(e){
  if(moved)return;
  var sw=e.target.closest(".sw");if(!sw)return;
  var id=+sw.dataset.id,b=e.target.closest(".cp,.cpa");
  if(b){copy(b.dataset.c,b,b.dataset.l)}
  else if(e.target.closest(".ck")){tog(id)}
  else if(e.target.closest(".nm,.amt")){
    openId=openId===id?0:id;
    document.querySelectorAll(".sw.open").forEach(function(x){x.classList.remove("open")});
    if(openId)sw.classList.add("open");
  }
});
L.addEventListener("change",function(e){
  if(!e.target.classList.contains("ni"))return;
  var id=+e.target.closest(".sw").dataset.id,v=e.target.value.trim();
  if(v===""||isNaN(Number(v)))delete np[id];else np[id]=Number(v);
  sv(NK,np);openId=id;render();
});
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){tab=b.dataset.t;render();window.scrollTo(0,0)}});
$("q").oninput=render;
$("sb").onclick=function(){var s=$("sr");s.classList.toggle("on");if(s.classList.contains("on"))$("q").focus();else{$("q").value="";render()}};
var rt=0;
$("rst").onclick=function(){
  var b=this;
  if(!rt){b.textContent="Sure?";rt=setTimeout(function(){rt=0;b.textContent="\u21ba"},2500);return}
  clearTimeout(rt);rt=0;b.textContent="\u21ba";done={};sv(KEY,done);render();toast("Ticks cleared");
};
$("nx").onclick=function(){
  var e=L.querySelector(".sw:not(.done)");
  if(!e){toast("All done \ud83c\udf89");return}
  e.scrollIntoView({behavior:"smooth",block:"center"});
  e.classList.remove("hl");void e.offsetWidth;e.classList.add("hl");vib(8);
};
var ly=0;
window.addEventListener("scroll",function(){var y=window.scrollY;$("hd").classList.toggle("hide",y>ly&&y>90);ly=y},{passive:true});
render();
</script>
</body>
</html>
